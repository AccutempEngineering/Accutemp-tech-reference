<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<meta name="theme-color" content="#14324f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Accutemp Ref">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Accutemp Field Reference</title>
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" href="app-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="app-icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="topbar" id="topbar">
  <header>
    <div class="hrow"><span class="brand">Accutemp Field Reference</span><span class="netstate" id="netstate" hidden>Offline</span></div>
    <div class="searchrow">
      <div class="searchbox">
        <input id="q" type="search" placeholder="Search cards or model #" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search all cards">
        <button id="clearq" type="button" aria-label="Clear search" hidden>&times;</button>
      </div>
      <button id="filterbtn" type="button" aria-expanded="false" aria-controls="drawer">Filters</button>
    </div>
  </header>
  <div class="drawer" id="drawer"><div class="inner"><div class="searchintro" id="searchintro"></div><div class="chipwrap" id="chips"></div></div></div>
  <div class="activefilter" id="activefilter"><span id="activelabel"></span><button type="button" id="clearfilter">Clear filter</button></div>
  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
</div>
<main id="main" tabindex="-1"><noscript><div class="loaderr">This page needs JavaScript turned on to show the cards.</div></noscript></main>
<button id="totop" type="button" aria-label="Back to top">&#8679;</button>
<script src="cards.js"></script>
<script src="app.js"></script>
</body>
</html>
